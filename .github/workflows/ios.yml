name: iOS Build

on:
  push:
    branches: ["agent/ios-job-radar"]
    paths: ["ios/JobRadar/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/JobRadar/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/JobRadar
        run: xcodegen generate
      - name: Build for iOS Simulator
        working-directory: ios/JobRadar
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project JobRadar.xcodeproj \
            -scheme JobRadar \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/JobRadar/build.log
          if-no-files-found: warn
