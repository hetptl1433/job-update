<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>Het's Job Status</title>
  <meta name="description" content="Company and interview status at a glance." />
  <link rel="stylesheet" href="styles-mobile.css?v=3" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
  <script src="data/seed.js?v=3" defer></script>
  <script src="app-mobile.js?v=3" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="workspace">
      <header class="topbar">
        <div class="title-block">
          <div>
            <h1>Job Status</h1>
            <p>Company and current status at a glance.</p>
          </div>
          <button id="addButton" class="button primary"><span data-icon="plus"></span> Add</button>
        </div>

        <div class="top-actions">
          <div id="syncIndicator" class="sync-indicator local"><span class="sync-dot"></span><span id="syncText">Loading</span></div>
          <div class="utility-actions">
            <button id="importButton" class="button secondary"><span data-icon="upload"></span> Import</button>
            <input id="fileInput" type="file" accept=".xlsx,.xls,.csv,.json" hidden />
            <button id="exportButton" class="button secondary"><span data-icon="download"></span> Export</button>
          </div>
        </div>
      </header>

      <section id="metricGrid" class="metric-grid" aria-label="Pipeline summary"></section>

      <section class="tracker-section">
        <div class="tracker-toolbar">
          <div class="tabs" id="filterTabs"></div>
          <div class="search-box"><span data-icon="search"></span><input id="searchInput" aria-label="Search companies" placeholder="Search company or role" /></div>
        </div>

        <div class="table-wrap">
          <div id="trackerBody" class="status-board"></div>
          <div id="emptyState" class="empty-state" hidden>
            <span data-icon="search"></span>
            <h3>No companies found</h3>
            <p>Try another filter or search.</p>
          </div>
        </div>
      </section>

      <footer class="footer-bar">
        <div><span data-icon="lock"></span><span id="storageCopy">Loading tracker data…</span></div>
        <div class="password-field"><label for="adminPassword">Admin password</label><input id="adminPassword" type="password" placeholder="Enter to sync edits" /></div>
        <button id="saveButton" class="button save-button"><span data-icon="save"></span> Save</button>
        <span id="lastSync" class="last-sync"></span>
      </footer>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <form id="editForm" class="edit-modal">
      <div class="modal-head">
        <div><h2 id="modalTitle">Update status</h2><p>Keep the company status and next action current.</p></div>
        <button id="closeModal" type="button" class="icon-button" aria-label="Close"><span data-icon="close"></span></button>
      </div>

      <div class="form-grid">
        <label class="form-field"><span>Company</span><input name="company" required /></label>
        <label class="form-field"><span>Role</span><input name="role" required /></label>
        <label class="form-field"><span>Stage</span><select name="stage"></select></label>
        <label class="form-field"><span>Status</span><select name="status"></select></label>
        <label class="form-field"><span>Priority</span><select name="priority"></select></label>
        <label class="form-field"><span>Invite date</span><input type="date" name="inviteDate" /></label>
        <label class="form-field"><span>Interview date</span><input type="date" name="interviewDate" /></label>
        <label class="form-field"><span>Follow-up date</span><input type="date" name="followUpDate" /></label>
        <label class="form-field"><span>Contact / recruiter</span><input name="contact" /></label>
        <label class="form-field"><span>Mode / location</span><input name="mode" /></label>
        <label class="form-field wide"><span>Next action</span><input name="nextAction" /></label>
        <label class="form-field wide"><span>Source / evidence</span><input name="source" /></label>
        <label class="form-field wide"><span>Notes</span><textarea name="notes" rows="4"></textarea></label>
      </div>

      <div class="modal-actions">
        <div><button id="deleteButton" type="button" class="button danger"><span data-icon="trash"></span> Delete</button></div>
        <div class="right-actions">
          <a id="sourceButton" class="button secondary" target="_blank" rel="noreferrer"><span data-icon="external"></span> Source</a>
          <button id="cancelButton" type="button" class="button secondary">Cancel</button>
          <button class="button primary" type="submit">Update</button>
        </div>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
