name: JobRadar
options:
  bundleIdPrefix: com.hetpatel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JobRadar:
    type: application
    platform: iOS
    sources:
      - path: JobRadar
    info:
      path: JobRadar/Resources/Info.plist
    entitlements:
      path: JobRadar/Resources/JobRadar.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hetpatel.jobradar
        PRODUCT_NAME: Job Radar
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  JobRadar:
    build:
      targets:
        JobRadar: all
    run:
      config: Debug
    archive:
      config: Release
